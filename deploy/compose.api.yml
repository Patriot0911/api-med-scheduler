# one colour of the API; deploy.sh runs it as project med-api-<colour>
name: med-api-${COLOR:?COLOR must be blue or green}

services:
  api:
    image: ${API_IMAGE:-ghcr.io/patriot0911/api-med-scheduler}:${API_TAG:?API_TAG is required}
    container_name: api-${COLOR}
    restart: unless-stopped
    env_file: env/api.env
    environment:
      APP_ENV: production
      APP_PORT: '3000'
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_MIGRATIONS_RUN: 'FALSE'
      NODE_OPTIONS: --max-old-space-size=320
    networks: [edge, backend,]
    mem_limit: 448m
    stop_grace_period: 20s
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/api/health/ready']
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s

networks:
  edge:
    name: med-edge
    external: true
  backend:
    name: med-backend
    external: true
