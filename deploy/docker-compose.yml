# production stack of the API; lives on the server in /app/med-scheduler/api next to .env
name: med-api

services:
  postgres:
    image: postgres:16-alpine
    container_name: med-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: ${DB_NAME:?}
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - max_connections=60
      - -c
      - log_min_duration_statement=500
    # loopback only: reachable for backups / ssh tunnel, never from outside
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256m
    mem_limit: 1536m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ${API_IMAGE:-ghcr.io/patriot0911/api-med-scheduler}:${API_TAG:-latest}
    command: migrate
    env_file: .env
    environment: &api-env
      APP_ENV: production
      APP_PORT: '3000'
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_MIGRATIONS_RUN: 'FALSE'
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    image: ${API_IMAGE:-ghcr.io/patriot0911/api-med-scheduler}:${API_TAG:-latest}
    container_name: med-api
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *api-env
      NODE_OPTIONS: --max-old-space-size=320
    # the host reverse proxy terminates TLS and forwards the API domain here
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    mem_limit: 448m
    stop_grace_period: 20s
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/api/health/ready']
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
