name: med-infra

services:
  caddy:
    image: caddy:2.11-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    env_file: env/caddy.env
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # a directory mount keeps an atomically replaced file visible inside the container
      - ./caddy/active:/etc/caddy/active:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge,]
    mem_limit: 128m

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    # no published port: Docker's iptables rules would bypass ufw
    env_file: env/postgres.env
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - max_connections=60
      - -c
      - log_min_duration_statement=500
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend,]
    shm_size: 256m
    mem_limit: 1536m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  edge:
    name: med-edge
  backend:
    name: med-backend
    internal: true
